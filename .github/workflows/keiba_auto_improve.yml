name: AUC自動改善ループ（火曜深夜）

on:
  schedule:
    - cron: '0 3 * * 3'   # 水曜 03:00 UTC = 水曜 12:00 JST（keiba_update完了後）
  workflow_dispatch:

permissions:
  contents: write

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_UPDATE }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt
          echo "✅ pip install 完了"

      - name: データ準備（スクレイピング・クリーニング・特徴量生成）
        run: |
          # cleaned_races.csv がなければスクレイピングから実行
          if [ ! -f keiba_predictor/data/cleaned_races.csv ]; then
            echo "📥 cleaned_races.csv なし → スクレイピング実行"
            TWO_WEEKS_AGO=$(date -d "14 days ago" +%Y-%m 2>/dev/null || \
              python3 -c "from datetime import date,timedelta;print((date.today()-timedelta(days=14)).strftime('%Y-%m'))")
            END=$(date +%Y-%m)
            python -m keiba_predictor.main scrape --start "$TWO_WEEKS_AGO" --end "$END" || true
            python -m keiba_predictor.main clean || true
          fi
          # featured_races.csv を生成
          if [ ! -f keiba_predictor/data/featured_races.csv ]; then
            echo "📊 特徴量生成中..."
            python -m keiba_predictor.main features
          fi

      - name: featured_races.csv を確認
        run: |
          if [ ! -f keiba_predictor/data/featured_races.csv ]; then
            echo "::warning::featured_races.csv 生成失敗 → 自動改善スキップ"
            echo "SKIP=true" >> $GITHUB_ENV
          else
            ROWS=$(wc -l < keiba_predictor/data/featured_races.csv)
            echo "✅ featured_races.csv: ${ROWS} 行"
            echo "SKIP=false" >> $GITHUB_ENV
          fi

      - name: 自動改善ループを実行
        if: env.SKIP != 'true'
        run: python -m keiba_predictor.model.auto_improve

      - name: 改善結果をコミット
        if: env.SKIP != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git config rebase.autoStash true
          git add keiba_predictor/model/xgb_model.pkl 2>/dev/null || true
          git add keiba_predictor/model/best_params.json 2>/dev/null || true
          git add keiba_predictor/model/xgb_model_*.pkl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 変更なし（改善なし）"
          else
            git commit -m "chore: AUC自動改善ループ [skip ci]"
            git pull --rebase -X theirs origin ${{ github.ref_name }} || true
            git push
            echo "✅ コミット・プッシュ完了"
          fi

      - name: ❌ エラーを Discord に通知
        if: failure()
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ **AUC自動改善ループが失敗しました**\nログ: ${RUN_URL}\"}" || true
