name: オッズ更新・スナップショット（土日）

on:
  schedule:
    - cron: '0 4 * * 6'    # 土曜 13:00 JST（オッズ更新・大口検知・スナップショット）
    - cron: '0 4 * * 0'    # 日曜 13:00 JST
    - cron: '30 5 * * 6'   # 土曜 14:30 JST（最終オッズ再計算・差異あれば通知）
    - cron: '30 5 * * 0'   # 日曜 14:30 JST
  workflow_dispatch:

permissions:
  contents: write

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-odds:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 最新コミットをプル
        run: |
          git config pull.rebase true
          git config rebase.autoStash true
          git pull --rebase origin ${{ github.ref_name }} || true

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: Playwright Chromium をインストール
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: オッズを更新
        run: python -m keiba_predictor.odds_updater
        continue-on-error: true

      - name: スナップショットを保存
        run: python -m keiba_predictor.main snapshot
        continue-on-error: true

      - name: キャッシュ・スナップショットをコミット・プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git config rebase.autoStash true
          git add keiba_predictor/data/predictions_cache.json 2>/dev/null || true
          git add keiba_predictor/data/predictions_snapshot_*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 変更なし（コミットスキップ）"
          else
            git commit -m "chore: オッズ更新・スナップショット保存 [skip ci]"
            git pull --rebase -X theirs origin ${{ github.ref_name }} || true
            git push
            echo "✅ コミット・プッシュ完了"
          fi

      - name: ❌ エラーを Discord に通知
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ **オッズ更新ワークフローが失敗しました**\nログ: ${RUN_URL}\"}" || true
