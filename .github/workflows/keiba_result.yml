name: 日曜結果通知

on:
  schedule:
    - cron: '0 8 * * 0'  # 毎週日曜 8:00 UTC = JST 17:00
  workflow_dispatch:       # 手動実行ボタンも有効化
    inputs:
      race_id:
        description: '結果照合対象のレースID（例: 202506050811）。空欄の場合は予想キャッシュ内の全レースを対象。'
        required: false
        default: ''

# ジョブ全体で環境変数を参照できるようにする
env:
  DISCORD_WEBHOOK_URL:        ${{ secrets.DISCORD_WEBHOOK_RESULT }}
  DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
  GEMINI_API_KEY:             ${{ secrets.GEMINI_API_KEY }}
  TWITTER_API_KEY:             ${{ secrets.TWITTER_API_KEY }}
  TWITTER_API_SECRET:          ${{ secrets.TWITTER_API_SECRET }}
  TWITTER_ACCESS_TOKEN:        ${{ secrets.TWITTER_ACCESS_TOKEN }}
  TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  result:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト（金曜キャッシュ込み）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 最新コミットをプル（金曜の予想キャッシュを反映）
        run: |
          git pull --ff-only origin ${{ github.ref_name }} || true
          echo "📦 予想キャッシュ確認:"
          ls -la keiba_predictor/data/predictions_cache.json 2>/dev/null \
            && echo "✅ キャッシュあり" \
            || echo "⚠️ キャッシュなし（金曜ワークフローが未実行の可能性）"

      # ── 早期バリデーション ────────────────────────────────────
      - name: Discord Webhook URL を確認
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL が設定されていません。"
            echo "::error::GitHub リポジトリの Settings > Secrets > Actions で登録してください。"
            exit 1
          fi
          echo "✅ DISCORD_WEBHOOK_URL: 設定済み (末尾6桁: ...${DISCORD_WEBHOOK_URL: -6})"

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt
          echo "✅ pip install 完了"

      # ── Discord 結果通知（デバッグモード有効）────────────────
      - name: Discord に結果を送信
        run: |
          echo "📤 Discord 結果通知を送信中..."
          RACE_ID="${{ inputs.race_id }}"
          if [ -n "$RACE_ID" ]; then
            echo "🎯 指定レースID: $RACE_ID"
            python -m keiba_predictor.main notify --mode result --debug --race-id "$RACE_ID"
          else
            echo "📋 レースID未指定 → キャッシュ内の全レースを対象"
            python -m keiba_predictor.main notify --mode result --debug
          fi
          echo "✅ notify コマンド終了"

      # ── エラー時の Discord 通知 ──────────────────────────────
      - name: ❌ エラーを Discord に通知
        if: failure()
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Webhook URL 未設定のため Discord 通知をスキップ"
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ **日曜結果ワークフローが失敗しました**\nログ: ${RUN_URL}\"}" \
            && echo "Discord エラー通知送信済み" \
            || echo "Discord エラー通知の送信に失敗"
