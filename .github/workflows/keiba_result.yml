name: 日曜結果通知

on:
  schedule:
    - cron: '0 8 * * 0'  # 毎週日曜 8:00 UTC = JST 17:00
  workflow_dispatch:       # 手動実行ボタンも有効化

jobs:
  result:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト（金曜キャッシュ込み）
        uses: actions/checkout@v4
        with:
          # 金曜にコミットされた予想キャッシュを取得するため
          # fetch-depth: 0 で最新コミットを確実に取得
          fetch-depth: 0

      - name: 最新コミットをプル（金曜の予想キャッシュを反映）
        run: git pull --ff-only origin ${{ github.ref_name }} || true

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      # ── データ収集（直近3ヶ月）────────────────────────────────
      - name: スクレイピング（直近3ヶ月）
        run: |
          YEAR=$(date +%Y)
          MONTH=$(date +%-m)
          START_MONTH=$((MONTH - 3))
          START_YEAR=$YEAR
          if [ $START_MONTH -le 0 ]; then
            START_MONTH=$((START_MONTH + 12))
            START_YEAR=$((YEAR - 1))
          fi
          python -m keiba_predictor.main scrape \
            --start "${START_YEAR}-$(printf '%02d' $START_MONTH)" \
            --end "${YEAR}-$(printf '%02d' $MONTH)"

      - name: データクリーニング
        run: python -m keiba_predictor.main clean

      - name: 特徴量エンジニアリング
        run: python -m keiba_predictor.main features

      - name: モデル学習
        run: python -m keiba_predictor.main train

      # ── Discord 結果通知 ───────────────────────────────────────
      - name: Discord に結果を送信
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m keiba_predictor.main notify --mode result
