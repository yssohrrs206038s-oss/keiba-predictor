name: 結果通知（土日）

on:
  schedule:
    - cron: '0 9 * * 6'   # 土曜 18:00 JST（土曜レースのみ照合）
    - cron: '0 9 * * 0'   # 日曜 18:00 JST（全レース照合・週次サマリー）
  workflow_dispatch:       # 手動実行ボタンも有効化
    inputs:
      race_id:
        description: '結果照合対象のレースID（例: 202506050811）。空欄の場合は予想キャッシュ内の全レースを対象。'
        required: false
        default: ''

permissions:
  contents: write

env:
  DISCORD_WEBHOOK_URL:        ${{ secrets.DISCORD_WEBHOOK_RESULT }}
  DISCORD_RESULT_WEBHOOK_URL: ${{ secrets.DISCORD_RESULT_WEBHOOK_URL }}
  DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
  TWITTER_API_KEY:             ${{ secrets.TWITTER_API_KEY }}
  TWITTER_API_SECRET:          ${{ secrets.TWITTER_API_SECRET }}
  TWITTER_ACCESS_TOKEN:        ${{ secrets.TWITTER_ACCESS_TOKEN }}
  TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
  ENABLE_X_POST: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  result:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト（金曜キャッシュ込み）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 最新コミットをプル（金曜の予想キャッシュを反映）
        run: |
          git config pull.rebase true
          git config rebase.autoStash true
          git pull --rebase origin ${{ github.ref_name }} || true
          echo "📦 予想キャッシュ確認:"
          ls -la keiba_predictor/data/predictions_cache.json 2>/dev/null \
            && echo "✅ キャッシュあり" \
            || echo "⚠️ キャッシュなし（金曜ワークフローが未実行の可能性）"

      # ── 早期バリデーション ────────────────────────────────────
      - name: Discord Webhook URL を確認
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL が設定されていません。"
            echo "::error::GitHub リポジトリの Settings > Secrets > Actions で登録してください。"
            exit 1
          fi
          echo "✅ DISCORD_WEBHOOK_URL: 設定済み (末尾6桁: ...${DISCORD_WEBHOOK_URL: -6})"

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt
          echo "✅ pip install 完了"

      # ── Discord 結果通知（デバッグモード有効）────────────────
      - name: Discord に結果を送信
        run: |
          echo "📤 Discord 結果通知を送信中..."
          RACE_ID="${{ inputs.race_id }}"
          if [ -n "$RACE_ID" ]; then
            echo "🎯 指定レースID: $RACE_ID"
            python -m keiba_predictor.main notify --mode result --race-id "$RACE_ID"
          else
            echo "📋 レースID未指定 → キャッシュ内の全レースを対象"
            python -m keiba_predictor.main notify --mode result
          fi
          echo "✅ notify コマンド終了"

      # ── 週次外れ分析 ──────────────────────────────────────
      - name: 週次外れ分析
        continue-on-error: true
        run: python -m keiba_predictor.analysis.loss_analysis

      # ── 結果履歴をリポジトリに保存 ──────────────────────────
      - name: 結果履歴をコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git config rebase.autoStash true
          git add keiba_predictor/data/results_history.csv 2>/dev/null || true
          git add keiba_predictor/data/manual_results.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 変更なし（コミットスキップ）"
          else
            git commit -m "chore: 結果履歴を更新 [skip ci]"
            git pull --rebase -X theirs origin ${{ github.ref_name }} || true
            git push
            echo "✅ コミット・プッシュ完了"
          fi

      # ── エラー時の Discord 通知 ──────────────────────────────
      - name: ❌ エラーを Discord に通知
        if: failure()
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Webhook URL 未設定のため Discord 通知をスキップ"
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ **日曜結果ワークフローが失敗しました**\nログ: ${RUN_URL}\"}" \
            && echo "Discord エラー通知送信済み" \
            || echo "Discord エラー通知の送信に失敗"
