name: 水曜データ更新

on:
  schedule:
    - cron: '0 0 * * 3'  # 毎週水曜 0:00 UTC = JST 9:00
  workflow_dispatch:       # 手動実行ボタンも有効化

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_UPDATE }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Discord Webhook URL を確認
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL が設定されていません。"
            exit 1
          fi
          echo "✅ DISCORD_WEBHOOK_URL: 設定済み"

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt
          echo "✅ pip install 完了"

      # ── データ収集 ──────────────────────────────────────────
      - name: スクレイピング（直近2週間）
        run: |
          TWO_WEEKS_AGO=$(date -d "14 days ago" +%Y-%m 2>/dev/null || \
            python3 -c "from datetime import date,timedelta;print((date.today()-timedelta(days=14)).strftime('%Y-%m'))")
          END=$(date +%Y-%m)
          echo "📅 スクレイピング期間: $TWO_WEEKS_AGO ～ $END"
          python -m keiba_predictor.main scrape --start "$TWO_WEEKS_AGO" --end "$END"

      - name: データクリーニング
        run: |
          python -m keiba_predictor.main clean
          echo "✅ クリーニング完了"

      # ── 今週末重賞をキャッシュに保存 ─────────────────────────
      - name: 今週末重賞をキャッシュに保存
        continue-on-error: true
        run: python -m keiba_predictor.main update-featured --save-cache

      # ── 成果物をリポジトリにコミット ─────────────────────────
      - name: データをコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git config rebase.autoStash true
          git add keiba_predictor/data/predictions_cache.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 変更なし（コミットスキップ）"
          else
            git commit -m "chore: 水曜データ更新 [skip ci]"
            git pull --rebase -X theirs origin ${{ github.ref_name }} || true
            git push
            echo "✅ コミット・プッシュ完了"
          fi

      # ── Discord に完了通知 ────────────────────────────────────
      - name: ✅ 完了を Discord に通知
        run: |
          PAYLOAD=$(python3 -c "
          import json
          msg = (
              '\`\`\`\n'
              '✅ KEIBA EDGE データ更新完了\n'
              '新規データ取得完了（直近2週間）\n'
              'モデルはローカルPCで再学習してください\n'
              '次回予想: 土曜9時\n'
              '\`\`\`'
          )
          print(json.dumps({'content': msg}))
          ")
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            && echo "✅ Discord 通知送信完了" \
            || echo "::warning::Discord 通知の送信に失敗しました"

      # ── クレジット残量チェック ─────────────────────────────────
      - name: クレジット残量チェック
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: python -m keiba_predictor.credit_monitor

      # ── エラー時の Discord 通知 ──────────────────────────────
      - name: ❌ エラーを Discord に通知
        if: failure()
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ **水曜データ更新ワークフローが失敗しました**\nログ: ${RUN_URL}\"}" || true
