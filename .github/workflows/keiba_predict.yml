name: 予想通知（土日）

on:
  schedule:
    - cron: '0 5 * * 6'   # 土曜 14:00 JST
    - cron: '0 5 * * 0'   # 日曜 14:00 JST
  workflow_dispatch:       # 手動実行ボタンも有効化
    inputs:
      race_id:
        description: '予測対象のレースID（例: 202506050811）。空欄の場合は当週の全対象レースを自動取得。'
        required: false
        default: ''

# ジョブ全体で環境変数を参照できるようにする
env:
  DISCORD_WEBHOOK_URL:        ${{ secrets.DISCORD_WEBHOOK_URL }}
  DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
  ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
  TWITTER_API_KEY:             ${{ secrets.TWITTER_API_KEY }}
  TWITTER_API_SECRET:          ${{ secrets.TWITTER_API_SECRET }}
  TWITTER_ACCESS_TOKEN:        ${{ secrets.TWITTER_ACCESS_TOKEN }}
  TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # ── 早期バリデーション ────────────────────────────────────
      - name: Discord Webhook URL を確認
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL が設定されていません。"
            echo "::error::GitHub リポジトリの Settings > Secrets > Actions で登録してください。"
            exit 1
          fi
          echo "✅ DISCORD_WEBHOOK_URL: 設定済み (末尾6桁: ...${DISCORD_WEBHOOK_URL: -6})"

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt
          echo "✅ pip install 完了"

      - name: Playwright Chromium をインストール
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium
          echo "✅ Playwright Chromium インストール完了"

      # ── featured_races.csv 確認・生成 ────────────────────────
      - name: featured_races.csv を確認・生成
        run: |
          CSV_PATH="keiba_predictor/data/featured_races.csv"
          if [ ! -f "$CSV_PATH" ]; then
            echo "⚠️ featured_races.csv が見つかりません。clean・features を実行します..."
            python -m keiba_predictor.main clean
            python -m keiba_predictor.main features
            echo "✅ featured_races.csv 生成完了"
          else
            echo "✅ featured_races.csv 確認OK: $CSV_PATH"
          fi

      # ── モデルファイル確認 ────────────────────────────────────
      - name: モデルファイルを確認
        run: |
          MODEL_PATH="keiba_predictor/model/xgb_model.pkl"
          if [ ! -f "$MODEL_PATH" ]; then
            echo "::error::モデルファイルが見つかりません: $MODEL_PATH"
            echo "::error::先に keiba_update.yml を実行してください。"
            exit 1
          fi
          echo "✅ モデルファイル確認OK: $MODEL_PATH"

      # ── 今週末重賞 CSV を更新 ────────────────────────────────
      - name: 今週末重賞CSVを更新
        continue-on-error: true
        run: python -m keiba_predictor.main update-featured

      # ── Discord 予想通知（デバッグモード有効）────────────────
      - name: Discord に予想を送信
        id: notify_predict
        continue-on-error: true   # ネットワーク障害・スクレイピング失敗でも後続ステップを継続
        run: |
          echo "📤 Discord 予想通知を送信中..."
          # predictions_cache.json にデータがあればキャッシュから送信のみ行う
          # (predict_live を再実行すると cleaned_races.csv 不在で確率が壊れるため)
          echo "📋 キャッシュ優先で予想通知を送信"
          python -m keiba_predictor.main notify --mode predict --debug
          echo "✅ predict/notify コマンド終了"

      # ── note 記事用レポート生成 ───────────────────────────────
      # predict ステップ完了後（成否に関わらず）実行する
      # 予想キャッシュが空（{}）の場合はスキップ
      - name: note レポートを生成
        if: always()
        run: |
          if python - <<'EOF'
          import json, sys
          try:
              cache = json.load(open("keiba_predictor/data/predictions_cache.json"))
              if not cache:
                  print("⏭️ 予想キャッシュが空のためnoteレポートをスキップします")
                  sys.exit(1)
          except Exception as e:
              print(f"⏭️ キャッシュ確認エラー ({e})、スキップします")
              sys.exit(1)
          EOF
          then
            echo "📝 note レポートを生成中..."
            python -m keiba_predictor.note_report
            echo "✅ note レポート生成完了"
          fi

      # ── 予想キャッシュ・レポートをリポジトリに保存 ────────────
      - name: 予想キャッシュ・レポートをコミット
        if: always()   # predict/note_report が失敗してもキャッシュが更新されていれば保存する
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keiba_predictor/data/predictions_cache.json 2>/dev/null || true
          git add keiba_predictor/data/note_report_*.md       2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 変更なし（コミットスキップ）"
          else
            git commit -m "chore: 金曜予想キャッシュ・noteレポートを更新 [skip ci]"
            git push
            echo "✅ コミット・プッシュ完了"
          fi

      # ── エラー時の Discord 通知 ──────────────────────────────
      - name: ❌ エラーを Discord に通知
        if: failure()
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Webhook URL 未設定のため Discord 通知をスキップ"
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ **金曜予想ワークフローが失敗しました**\nログ: ${RUN_URL}\"}" \
            && echo "Discord エラー通知送信済み" \
            || echo "Discord エラー通知の送信に失敗"
