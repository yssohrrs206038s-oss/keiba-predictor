name: 金曜予想通知

on:
  schedule:
    - cron: '0 5 * * 5'  # 毎週金曜 5:00 UTC = JST 14:00
  workflow_dispatch:       # 手動実行ボタンも有効化

# ジョブ全体で環境変数を参照できるようにする
env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # ── 早期バリデーション ────────────────────────────────────
      - name: Discord Webhook URL を確認
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL が設定されていません。"
            echo "::error::GitHub リポジトリの Settings > Secrets > Actions で登録してください。"
            exit 1
          fi
          echo "✅ DISCORD_WEBHOOK_URL: 設定済み (末尾6桁: ...${DISCORD_WEBHOOK_URL: -6})"

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt
          echo "✅ pip install 完了"

      # ── featured_races.csv 確認・生成 ────────────────────────
      - name: featured_races.csv を確認・生成
        run: |
          CSV_PATH="keiba_predictor/data/featured_races.csv"
          if [ ! -f "$CSV_PATH" ]; then
            echo "⚠️ featured_races.csv が見つかりません。clean・features を実行します..."
            python -m keiba_predictor.main clean
            python -m keiba_predictor.main features
            echo "✅ featured_races.csv 生成完了"
          else
            echo "✅ featured_races.csv 確認OK: $CSV_PATH"
          fi

      # ── モデルファイル確認 ────────────────────────────────────
      - name: モデルファイルを確認
        run: |
          MODEL_PATH="keiba_predictor/model/xgb_model.pkl"
          if [ ! -f "$MODEL_PATH" ]; then
            echo "::error::モデルファイルが見つかりません: $MODEL_PATH"
            echo "::error::先に keiba_update.yml を実行してください。"
            exit 1
          fi
          echo "✅ モデルファイル確認OK: $MODEL_PATH"

      # ── Discord 予想通知（デバッグモード有効）────────────────
      - name: Discord に予想を送信
        run: |
          echo "📤 Discord 予想通知を送信中..."
          python -m keiba_predictor.main notify --mode predict --live --debug
          echo "✅ notify コマンド終了"

      # ── 予想キャッシュをリポジトリに保存 ────────────────────
      - name: 予想キャッシュをコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keiba_predictor/data/predictions_cache.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ キャッシュに変更なし（コミットスキップ）"
          else
            git commit -m "chore: 金曜予想キャッシュを更新 [skip ci]"
            git push
            echo "✅ キャッシュをコミット・プッシュ完了"
          fi

      # ── エラー時の Discord 通知 ──────────────────────────────
      - name: ❌ エラーを Discord に通知
        if: failure()
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Webhook URL 未設定のため Discord 通知をスキップ"
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ **金曜予想ワークフローが失敗しました**\nログ: ${RUN_URL}\"}" \
            && echo "Discord エラー通知送信済み" \
            || echo "Discord エラー通知の送信に失敗"
