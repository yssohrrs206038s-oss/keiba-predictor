name: 重賞予想・Discord通知（土日）

on:
  schedule:
    - cron: '0 0 * * 6'   # 土曜 09:00 JST — 予想生成+即通知
    - cron: '0 0 * * 0'   # 日曜 09:00 JST — 予想生成+即通知
  workflow_dispatch:
    inputs:
      mode:
        description: 'predict=予想生成+通知 / notify=通知のみ'
        required: false
        default: 'predict'

permissions:
  contents: write

env:
  DISCORD_WEBHOOK_URL:        ${{ secrets.DISCORD_WEBHOOK_URL }}
  DISCORD_RESULT_WEBHOOK_URL: ${{ secrets.DISCORD_RESULT_WEBHOOK_URL }}
  TWITTER_API_KEY:             ${{ secrets.TWITTER_API_KEY }}
  TWITTER_API_SECRET:          ${{ secrets.TWITTER_API_SECRET }}
  TWITTER_ACCESS_TOKEN:        ${{ secrets.TWITTER_ACCESS_TOKEN }}
  TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
  ENABLE_X_POST: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 最新コミットをプル
        run: |
          git config pull.rebase true
          git config rebase.autoStash true
          git pull --rebase origin ${{ github.ref_name }} || true

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: Playwright Chromium キャッシュ
        if: inputs.mode != 'notify'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Playwright Chromium をインストール
        if: inputs.mode != 'notify'
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            python -m playwright install chromium
          fi
          python -m playwright install-deps chromium

      - name: モデルファイルを確認
        run: |
          if [ ! -f keiba_predictor/model/xgb_model.pkl ]; then
            echo "::error::モデルファイルが見つかりません"
            exit 1
          fi

      - name: 過去成績データを確認
        if: inputs.mode != 'notify'
        run: |
          if [ -f keiba_predictor/data/cleaned_races.csv.gz ]; then
            SIZE=$(du -h keiba_predictor/data/cleaned_races.csv.gz | cut -f1)
            echo "✅ cleaned_races.csv.gz (${SIZE})"
          else
            echo "⚠️ 過去成績なし — 予想精度が低下します"
          fi

      - name: 重賞+平場（芝1勝以上）予想を生成
        if: inputs.mode != 'notify'
        continue-on-error: true
        run: |
          python -c "
          import sys, logging
          sys.stdout.reconfigure(encoding='utf-8', errors='replace')
          logging.basicConfig(level=logging.INFO, format='%(asctime)s %(levelname)s %(message)s')
          from keiba_predictor.discord_notify import _load_cache, scrape_grade_race_ids, scrape_flat_race_ids
          from keiba_predictor.model.predict import predict_live
          import requests

          from keiba_predictor.discord_notify import _save_cache

          session = requests.Session()
          cache = _load_cache()

          # 今週末以外のキャッシュを削除
          from keiba_predictor.discord_notify import _weekend_dates
          weekend_set = set()
          for d in _weekend_dates():
              weekend_set.add(f'{d[:4]}-{d[4:6]}-{d[6:]}')
          stale = [k for k, v in cache.items()
                   if not k.startswith('_') and isinstance(v, dict)
                   and v.get('race_date') and v['race_date'] not in weekend_set]
          if stale:
              for k in stale:
                  del cache[k]
              _save_cache(cache)
              print(f'  過去キャッシュ {len(stale)} 件削除')

          # 重賞
          grade_races = scrape_grade_race_ids(session)
          for race in grade_races:
              rid = race['race_id']
              name = race.get('race_name', rid)
              if cache.get(rid, {}).get('predicted_top3_nums'):
                  print(f'  キャッシュ済みスキップ: {name}')
                  continue
              try:
                  print(f'  重賞予想: {name} ({rid})')
                  predict_live(rid, notify=False, is_grade=True)
              except Exception as e:
                  print(f'  失敗: {name}: {e}')

          # 平場（芝・1勝クラス以上）
          flat_races = scrape_flat_race_ids(session)
          for race in flat_races:
              rid = race['race_id']
              name = race.get('race_name', rid)
              if cache.get(rid, {}).get('predicted_top3_nums'):
                  print(f'  キャッシュ済みスキップ: {name}')
                  continue
              try:
                  print(f'  平場予想: {name} ({rid})')
                  predict_live(rid, notify=False, is_grade=False)
              except Exception as e:
                  print(f'  失敗: {name}: {e}')
          print('予想生成完了')
          "

      - name: Discord に予想を送信
        run: python -m keiba_predictor.main notify --mode predict

      - name: キャッシュをコミット
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git config rebase.autoStash true
          git add keiba_predictor/data/predictions_cache.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 変更なし"
          else
            git commit -m "chore: 予想キャッシュ更新 [skip ci]"
            git pull --rebase -X theirs origin ${{ github.ref_name }} || true
            git push
          fi

      - name: ❌ エラーを Discord に通知
        if: failure()
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ **予想ワークフローが失敗しました**\nログ: ${RUN_URL}\"}" || true
